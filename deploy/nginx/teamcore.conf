map $http_upgrade $teamcore_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    server_name teamcoresportswear.org www.teamcoresportswear.org 3.87.169.239;
    server_tokens off;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location ^~ /uploads/ {
        alias /var/lib/teamcore/uploads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        include /etc/nginx/snippets/teamcore-proxy.conf;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/teamcore-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $teamcore_connection_upgrade;
    }
    location / {
        proxy_pass http://127.0.0.1:3104;
        include /etc/nginx/snippets/teamcore-proxy.conf;
    }
}
server {
    listen 80;
    server_name admin.teamcoresportswear.org;
    server_tokens off;
    root /opt/teamcore/current/frontend/admin-portal/dist;
    client_max_body_size 12m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location /api/ { proxy_pass http://127.0.0.1:3001/; include /etc/nginx/snippets/teamcore-proxy.conf; }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/teamcore-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $teamcore_connection_upgrade;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-store"; add_header X-Robots-Tag "noindex, nofollow" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; }
}
server {
    listen 80;
    server_name api.teamcoresportswear.org;
    server_tokens off;
    client_max_body_size 12m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/teamcore-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $teamcore_connection_upgrade;
    }
}

