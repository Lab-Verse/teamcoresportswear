# Include inside the customer TLS server block after starting scripts/serve.mjs.
# Keep the existing /api/ reverse proxy. The renderer uses port 3104 by default.
# Validate with nginx -t before reload. Do not include beside another location /.
location / {
    proxy_pass http://127.0.0.1:3104;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

location ^~ /assets/ {
    proxy_pass http://127.0.0.1:3104;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}
